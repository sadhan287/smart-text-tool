<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Text Tool</title>
<style>
body{font-family:Arial,sans-serif;background:#eef2ff;margin:0;padding:20px;color:#222} .box{max-width:500px;margin:30px auto;background:white;padding:20px;border-radius:15px;box-shadow:0 4px 15px #ccd}h1{color:#4338ca;text-align:center}textarea{width:100%;height:180px;box-sizing:border-box;padding:12px;border:1px solid #aaa;border-radius:8px;font-size:16px}button{background:#4338ca;color:white;border:0;border-radius:8px;padding:12px;margin:8px 4px 0 0;font-size:15px}#output{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f5f5;padding:10px;border-radius:8px}
</style>
</head>
<body><div class="box"><h1>Smart Text Tool</h1><p>Apna text likhiye:</p><textarea id="txt" placeholder="Yahan apna text likhen..."></textarea><br><button onclick="document.getElementById('output').textContent=document.getElementById('txt').value">Text Show Karein</button><button onclick="document.getElementById('txt').value='';document.getElementById('output').textContent=''">Clear</button><h3>Output</h3><div id="output"></div><p style="text-align:center;color:#666">Smart Text Tool</p></div></body></html>
